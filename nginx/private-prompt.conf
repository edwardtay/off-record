# Private Prompt Lab: pass public attestation evidence to Intel's and NVIDIA's verifiers,
# which send no CORS headers. Prompts and keys never come here: the page calls NEAR AI directly.
# Needs, in the http context:
#   map $http_cf_connecting_ip $p20_verify_client { default $http_cf_connecting_ip; "" $binary_remote_addr; }
#   limit_req_zone $p20_verify_client zone=p20verify:1m rate=20r/m;
# Resolved per request through `resolver`, so a DNS failure at boot cannot stop nginx.
location = /tools/private-prompt/verify/tdx {
  limit_except POST { deny all; }
  limit_req zone=p20verify burst=10 nodelay;
  limit_req_status 429;
  client_max_body_size 64k;
  resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
  set $p20_tdx cloud-api.phala.network;
  proxy_pass https://$p20_tdx/api/v1/attestations/verify;
  proxy_ssl_server_name on;
  proxy_set_header Host cloud-api.phala.network;
  proxy_set_header Cookie "";
  proxy_set_header Origin "";
  proxy_set_header Referer "";
  proxy_set_header Content-Type application/json;
  proxy_read_timeout 30s;
}
location = /tools/private-prompt/verify/gpu {
  limit_except POST { deny all; }
  limit_req zone=p20verify burst=10 nodelay;
  limit_req_status 429;
  client_max_body_size 256k;
  resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
  set $p20_nras nras.attestation.nvidia.com;
  proxy_pass https://$p20_nras/v3/attest/gpu;
  proxy_ssl_server_name on;
  proxy_set_header Host nras.attestation.nvidia.com;
  proxy_set_header Cookie "";
  proxy_set_header Origin "";
  proxy_set_header Referer "";
  proxy_set_header Content-Type application/json;
  proxy_read_timeout 30s;
}
