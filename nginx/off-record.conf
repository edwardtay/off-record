# Off Record pass-through, as deployed in prompt20.com's nginx server block.
# Needs, at http level:
#   map $http_cf_connecting_ip $p20_verify_client { default $http_cf_connecting_ip; "" $binary_remote_addr; }
#   limit_req_zone $p20_verify_client zone=p20verify:1m rate=40r/m;
# and, for the free demo relay (njs; main nginx.conf needs `load_module modules/ngx_http_js_module.so;`,
# off-record-relay.js goes in /etc/nginx/njs/ and the demo key in /etc/nginx/secrets/near-ai.key):
#   # Off Record demo relay: visitors without a NEAR AI key send through prompt20.com, which adds the demo
#   # key (written at deploy time, never in git). The njs handler takes only encrypted requests to the
#   # listed private models and counts calls per visitor and per UTC day.
#   js_path /etc/nginx/njs/;
#   js_import offrecord from off-record-relay.js;
#   js_shared_dict_zone zone=offrecord:1m timeout=2d type=number;
#   js_set $p20_near_auth offrecord.auth;
#   limit_req_zone $p20_verify_client zone=p20near:1m rate=20r/m;
#   map $uri $p20_near_uri {
#     default "";
#     "~^/tools/off-record/near/(chat/completions|signature/[A-Za-z0-9._:-]+)$" /v1/$1;
#   }

  # Off Record: pass public evidence to Intel's PCS and NVIDIA's verifier, which send no
  # CORS headers. Intel's collateral is signed by Intel and checked in the page, so this pass-through
  # cannot alter it unnoticed. A visitor's own key never comes here: with a key the page calls NEAR AI directly.
  # Resolved per request through `resolver`, so a DNS failure at boot cannot stop nginx.
  location ~ "^/tools/off-record/intel/tcb/(?<p20_fmspc>[0-9A-Fa-f]{12})$" {
    limit_except GET { deny all; }
    limit_req zone=p20verify burst=20 nodelay;
    limit_req_status 429;
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    proxy_ssl_server_name on;
    proxy_set_header Cookie "";
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_hide_header Set-Cookie;
    proxy_read_timeout 20s;
    set $p20_pcs api.trustedservices.intel.com;
    proxy_set_header Host api.trustedservices.intel.com;
    proxy_pass https://$p20_pcs/tdx/certification/v4/tcb?fmspc=$p20_fmspc;
  }
  location = /tools/off-record/intel/qe {
    limit_except GET { deny all; }
    limit_req zone=p20verify burst=20 nodelay;
    limit_req_status 429;
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    proxy_ssl_server_name on;
    proxy_set_header Cookie "";
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_hide_header Set-Cookie;
    proxy_read_timeout 20s;
    set $p20_pcs api.trustedservices.intel.com;
    proxy_set_header Host api.trustedservices.intel.com;
    proxy_pass https://$p20_pcs/tdx/certification/v4/qe/identity;
  }
  location ~ ^/tools/off-record/intel/pckcrl/(?<p20_ca>platform|processor)$ {
    limit_except GET { deny all; }
    limit_req zone=p20verify burst=20 nodelay;
    limit_req_status 429;
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    proxy_ssl_server_name on;
    proxy_set_header Cookie "";
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_hide_header Set-Cookie;
    proxy_read_timeout 20s;
    set $p20_pcs api.trustedservices.intel.com;
    proxy_set_header Host api.trustedservices.intel.com;
    proxy_pass https://$p20_pcs/sgx/certification/v4/pckcrl?ca=$p20_ca&encoding=der;
  }
  location = /tools/off-record/intel/rootcrl {
    limit_except GET { deny all; }
    limit_req zone=p20verify burst=20 nodelay;
    limit_req_status 429;
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    proxy_ssl_server_name on;
    proxy_set_header Cookie "";
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_hide_header Set-Cookie;
    proxy_read_timeout 20s;
    set $p20_pcs certificates.trustedservices.intel.com;
    proxy_set_header Host certificates.trustedservices.intel.com;
    proxy_pass https://$p20_pcs/IntelSGXRootCA.der;
  }
  location = /tools/off-record/verify/gpu {
    limit_except POST { deny all; }
    limit_req zone=p20verify burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 256k;
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    set $p20_nras nras.attestation.nvidia.com;
    proxy_pass https://$p20_nras/v3/attest/gpu;
    proxy_ssl_server_name on;
    proxy_set_header Host nras.attestation.nvidia.com;
    proxy_set_header Cookie "";
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_set_header Content-Type application/json;
    proxy_read_timeout 30s;
  }

  # Off Record demo relay (see the http-level note). Only the request headers the encrypted call needs
  # are passed on, so NEAR AI sees prompt20.com's address, never the visitor's IP or browser details.
  location = /tools/off-record/near/chat/completions {
    limit_except POST { deny all; }
    limit_req zone=p20near burst=10 nodelay;
    limit_req_status 429;
    error_page 429 = @offrecord_slow;
    client_max_body_size 400k;
    client_body_buffer_size 400k;
    js_content offrecord.chat;
    access_log off;
  }
  location ~ "^/tools/off-record/near/signature/[A-Za-z0-9._:-]+$" {
    limit_except GET { deny all; }
    limit_req zone=p20near burst=20 nodelay;
    limit_req_status 429;
    js_content offrecord.signature;
    access_log off;
  }
  location @offrecord_slow {
    default_type application/json;
    return 429 '{"error":{"message":"The free demo is busy. Wait a minute and send again, or add your own NEAR AI key.","relay":true}}';
  }
  location @offrecord_near {
    access_log off;
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    set $p20_near cloud-api.near.ai;
    proxy_pass https://$p20_near$p20_near_uri$is_args$args;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_set_header Host cloud-api.near.ai;
    proxy_set_header Authorization $p20_near_auth;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Accept $http_accept;
    proxy_set_header X-Signing-Algo $http_x_signing_algo;
    proxy_set_header X-Client-Pub-Key $http_x_client_pub_key;
    proxy_set_header X-Model-Pub-Key $http_x_model_pub_key;
    proxy_set_header X-Encryption-Version $http_x_encryption_version;
    proxy_set_header X-No-Aliasing $http_x_no_aliasing;
    proxy_hide_header Set-Cookie;
    proxy_buffering off;
    proxy_read_timeout 180s;
  }
